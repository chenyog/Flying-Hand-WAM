# @package _global_

defaults:
  - train
  - override /task: flying_hand_2cam512_1e-4
  - override hydra/job_logging: disabled
  - _self_

# Camera dimensions are inherited through
# task/flying_hand_2cam512_1e-4 -> data/flying_hand.yaml. Evaluation therefore
# uses head 480x360 and wrist 640x480 as raw inputs, resizes each to 256x192,
# and feeds their horizontal 512x192 composition to the model. Keep the
# dimensions in the data config as the single source of truth.

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: ../..
  policy_name: FastWAM
  task_namespace: flying_hand
  task_name: null
  task_config: flying_hand_clean
  instruction_type: seen
  eval_num_episodes: 100
  # Large quantitative evaluations should not save replay histories or render
  # videos unless explicitly requested by the caller.
  eval_video_log: false
  output_dir: /data/Flying-Hand-WAM/eval_results/fastwam/flying_hand/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}
  action_horizon: null
  # FastWAM-specific receding-horizon window, independent of the task
  # environment. The model predicts 32 actions and executes the first 24
  # before replanning (24 / 20 Hz = 1.2 s).
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  num_gpus: 1
  max_tasks_per_gpu: 1
  tasks: null

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
